<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="redFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#080a10"/>
  <!-- Shield outline -->
  <path d="M50 12 L82 24 L82 56 C82 72 50 88 50 88 C50 88 18 72 18 56 L18 24 Z" fill="#0f1422" stroke="url(#cupGold)" stroke-width="2.5"/>
  <!-- Crossed Blades -->
  <line x1="28" y1="28" x2="72" y2="72" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="28" x2="28" y2="72" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <!-- The Cup Trophy -->
  <path d="M36 34 L64 34 L60 54 C58 60 54 62 50 62 C46 62 42 60 40 54 Z" fill="url(#cupGold)" filter="url(#glow)"/>
  <!-- Cup Handles -->
  <path d="M36 38 C28 38 28 50 38 50" fill="none" stroke="url(#cupGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M64 38 C72 38 72 50 62 50" fill="none" stroke="url(#cupGold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="47" y="62" width="6" height="8" fill="url(#cupGold)"/>
  <rect x="38" y="70" width="24" height="4" rx="2" fill="url(#cupGold)"/>
</svg>
