<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="knightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20E3FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09070D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20E3FF"/>
      <stop offset="100%" stop-color="#120c1f"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#knightGlow)"/>

  <!-- Radar Grid Background -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#20E3FF" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#7B2CFF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#20E3FF" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#20E3FF" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>

  <!-- Cup Knight Silhouette -->
  <!-- Cup Base & Body -->
  <path d="M120 140 L150 290 Q200 320 250 290 L280 140 Z" fill="#180e2b" stroke="#20E3FF" stroke-width="5" filter="url(#neon)"/>
  
  <!-- Cup Rim -->
  <ellipse cx="200" cy="140" rx="80" ry="24" fill="#24113D" stroke="#20E3FF" stroke-width="4"/>
  <ellipse cx="200" cy="140" rx="66" ry="16" fill="#09070D" stroke="#7B2CFF" stroke-width="2"/>

  <!-- Handle (Left) -->
  <path d="M125 160 C70 170 70 250 142 260 C120 240 120 180 135 170 Z" fill="#120c1f" stroke="#20E3FF" stroke-width="4"/>

  <!-- Knight Visor / Armor Slit -->
  <path d="M165 200 L235 200 L225 218 L175 218 Z" fill="#20E3FF" filter="url(#neon)"/>
  <circle cx="185" cy="209" r="3" fill="#ffffff"/>
  <circle cx="215" cy="209" r="3" fill="#ffffff"/>

  <!-- Shield Insignia / Crest -->
  <polygon points="200,235 220,250 200,280 180,250" fill="none" stroke="#20E3FF" stroke-width="3"/>
  <polygon points="200,242 212,252 200,272 188,252" fill="#7B2CFF" opacity="0.8"/>

  <!-- Player 1 Badge -->
  <rect x="140" y="335" width="120" height="26" rx="4" fill="#09070D" stroke="#20E3FF" stroke-width="2"/>
  <text x="200" y="352" text-anchor="middle" fill="#20E3FF" font-family="'Press Start 2P', monospace" font-size="10" font-weight="bold">PLAYER 1</text>
</svg>
