<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="berserkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2DA6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#09070D" stop-opacity="0"/>
    </radialGradient>
    <filter id="pinkNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="170" fill="url(#berserkGlow)"/>

  <!-- Radar Grid Background -->
  <circle cx="200" cy="200" r="140" fill="none" stroke="#FF2DA6" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="200" r="90" fill="none" stroke="#7B2CFF" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#FF2DA6" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>
  <line x1="50" y1="200" x2="350" y2="200" stroke="#FF2DA6" stroke-width="1" stroke-dasharray="2 4" opacity="0.2"/>

  <!-- Cup Berserker Silhouette -->
  <!-- Horns / Aggressive Winglets -->
  <path d="M120 135 L90 100 L110 115 Z" fill="#FF2DA6" filter="url(#pinkNeon)"/>
  <path d="M280 135 L310 100 L290 115 Z" fill="#FF2DA6" filter="url(#pinkNeon)"/>

  <!-- Cup Base & Body -->
  <path d="M120 140 L150 290 Q200 320 250 290 L280 140 Z" fill="#180e2b" stroke="#FF2DA6" stroke-width="5" filter="url(#pinkNeon)"/>
  
  <!-- Cup Rim -->
  <ellipse cx="200" cy="140" rx="80" ry="24" fill="#24113D" stroke="#FF2DA6" stroke-width="4"/>
  <ellipse cx="200" cy="140" rx="66" ry="16" fill="#09070D" stroke="#7B2CFF" stroke-width="2"/>

  <!-- Handles (Dual Combat Grip) -->
  <path d="M125 160 C75 170 75 250 142 260 C120 240 120 180 135 170 Z" fill="#120c1f" stroke="#FF2DA6" stroke-width="4"/>
  <path d="M275 160 C325 170 325 250 258 260 C280 240 280 180 265 170 Z" fill="#120c1f" stroke="#FF2DA6" stroke-width="4"/>

  <!-- Berserker Visor / Angled Slit -->
  <polygon points="160,195 200,210 240,195 200,203" fill="#FF2DA6" filter="url(#pinkNeon)"/>
  <circle cx="185" cy="201" r="3" fill="#ffffff"/>
  <circle cx="215" cy="201" r="3" fill="#ffffff"/>

  <!-- Crossbones / Crossed Blasters Crest -->
  <path d="M185 240 L215 270 M215 240 L185 270" stroke="#FFD23F" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="255" r="5" fill="#FF2DA6"/>

  <!-- Player 2 Badge -->
  <rect x="140" y="335" width="120" height="26" rx="4" fill="#09070D" stroke="#FF2DA6" stroke-width="2"/>
  <text x="200" y="352" text-anchor="middle" fill="#FF2DA6" font-family="'Press Start 2P', monospace" font-size="10" font-weight="bold">PLAYER 2</text>
</svg>
