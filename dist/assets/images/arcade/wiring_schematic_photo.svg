<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="circuitBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#180e2b"/>
      <stop offset="100%" stop-color="#09070D"/>
    </radialGradient>
    <filter id="neonWire">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#circuitBg)"/>

  <!-- Breadboard Base -->
  <rect x="50" y="60" width="700" height="330" rx="10" fill="#1e1533" stroke="#7B2CFF" stroke-width="2"/>
  
  <!-- Arduino Uno Board Visual (Left) -->
  <g transform="translate(100, 100)">
    <rect width="200" height="250" rx="8" fill="#005C8A" stroke="#20E3FF" stroke-width="2"/>
    <text x="100" y="35" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="11">ARDUINO</text>
    <text x="100" y="55" text-anchor="middle" fill="#FFD23F" font-family="'Share Tech Mono', monospace" font-size="14">UNO R3</text>
    
    <!-- USB Port -->
    <rect x="-15" y="80" width="25" height="40" rx="3" fill="#A0A0A0"/>
    <text x="-8" y="105" fill="#000000" font-family="'Share Tech Mono', monospace" font-size="9" transform="rotate(-90 -8 105)">USB</text>

    <!-- ATmega328P Chip -->
    <rect x="60" y="120" width="80" height="40" rx="2" fill="#120c1f" stroke="#ffffff" stroke-width="1"/>
    <text x="100" y="145" text-anchor="middle" fill="#ffffff" font-family="'Share Tech Mono', monospace" font-size="10">ATmega328P</text>

    <!-- Digital Headers -->
    <rect x="180" y="70" width="12" height="150" fill="#000000"/>
    <!-- Analog Headers -->
    <rect x="10" y="180" width="12" height="60" fill="#000000"/>
  </g>

  <!-- Wiring connections to push buttons -->
  <path d="M300 180 C 400 180, 420 140, 500 140" fill="none" stroke="#20E3FF" stroke-width="3" filter="url(#neonWire)"/>
  <path d="M300 200 C 400 200, 420 200, 500 200" fill="none" stroke="#FF2DA6" stroke-width="3" filter="url(#neonWire)"/>
  <path d="M300 220 C 400 220, 420 260, 500 260" fill="none" stroke="#FFD23F" stroke-width="3" filter="url(#neonWire)"/>
  <path d="M300 240 C 400 240, 420 320, 500 320" fill="none" stroke="#7B2CFF" stroke-width="3" filter="url(#neonWire)"/>

  <!-- Resistors & LEDs Array (Right) -->
  <g transform="translate(500, 100)">
    <!-- Switch 1 -->
    <circle cx="50" cy="40" r="16" fill="#120c1f" stroke="#20E3FF" stroke-width="2"/>
    <circle cx="50" cy="40" r="8" fill="#20E3FF" filter="url(#neonWire)"/>
    <text x="100" y="45" fill="#20E3FF" font-family="'Share Tech Mono', monospace" font-size="14">PIN 2 (BTN1 Space) + 220Ω LED</text>

    <!-- Switch 2 -->
    <circle cx="50" cy="100" r="16" fill="#120c1f" stroke="#FF2DA6" stroke-width="2"/>
    <circle cx="50" cy="100" r="8" fill="#FF2DA6" filter="url(#neonWire)"/>
    <text x="100" y="105" fill="#FF2DA6" font-family="'Share Tech Mono', monospace" font-size="14">PIN 4 (BTN2 Health) + 220Ω LED</text>

    <!-- Switch 3 -->
    <circle cx="50" cy="160" r="16" fill="#120c1f" stroke="#FFD23F" stroke-width="2"/>
    <circle cx="50" cy="160" r="8" fill="#FFD23F" filter="url(#neonWire)"/>
    <text x="100" y="165" fill="#FFD23F" font-family="'Share Tech Mono', monospace" font-size="14">PIN 10 (UP W) + 220Ω LED</text>

    <!-- Switch 4 -->
    <circle cx="50" cy="220" r="16" fill="#120c1f" stroke="#7B2CFF" stroke-width="2"/>
    <circle cx="50" cy="220" r="8" fill="#7B2CFF" filter="url(#neonWire)"/>
    <text x="100" y="225" fill="#7B2CFF" font-family="'Share Tech Mono', monospace" font-size="14">GND COMMON BUS (INPUT_PULLUP)</text>
  </g>

  <!-- Banner -->
  <text x="400" y="415" text-anchor="middle" fill="#FFD23F" font-family="'Press Start 2P', monospace" font-size="11">CIRCUIT SCHEMATIC &amp; HARDWARE TEST BENCH</text>
</svg>
