<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="deskGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24113D"/>
      <stop offset="100%" stop-color="#09070D"/>
    </radialGradient>
    <filter id="ledGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#deskGlow)"/>

  <!-- Metal Deck Surface -->
  <rect x="40" y="50" width="720" height="350" rx="16" fill="#120c1f" stroke="#7B2CFF" stroke-width="3"/>
  <rect x="50" y="60" width="700" height="330" rx="12" fill="#180e2b" stroke="#24113D" stroke-width="2"/>

  <!-- Center Divider -->
  <line x1="400" y1="60" x2="400" y2="390" stroke="#7B2CFF" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- PLAYER 1 DECK (LEFT) -->
  <text x="220" y="95" text-anchor="middle" fill="#20E3FF" font-family="'Press Start 2P', monospace" font-size="14">PLAYER 1 [ARDUINO #1]</text>
  
  <!-- D-Pad P1 -->
  <g transform="translate(130, 200)">
    <rect x="-16" y="-55" width="32" height="32" rx="6" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="0" y="-35" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="10">W</text>
    <rect x="-16" y="23" width="32" height="32" rx="6" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="0" y="43" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="10">S</text>
    <rect x="-55" y="-16" width="32" height="32" rx="6" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="-39" y="4" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="10">A</text>
    <rect x="23" y="-16" width="32" height="32" rx="6" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="39" y="4" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="10">D</text>
    <circle cx="0" cy="0" r="10" fill="#7B2CFF"/>
  </g>

  <!-- Action Buttons P1 -->
  <g transform="translate(290, 200)">
    <circle cx="-35" cy="-25" r="18" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="-35" y="-20" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="9">E</text>
    
    <circle cx="25" cy="-25" r="18" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="25" y="-20" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="9">Q</text>
    
    <rect x="-40" y="25" width="80" height="28" rx="8" fill="#20E3FF" filter="url(#ledGlow)"/>
    <text x="0" y="43" text-anchor="middle" fill="#09070D" font-family="'Press Start 2P', monospace" font-size="9">SPACE</text>
  </g>

  <!-- PLAYER 2 DECK (RIGHT) -->
  <text x="580" y="95" text-anchor="middle" fill="#FF2DA6" font-family="'Press Start 2P', monospace" font-size="14">PLAYER 2 [ARDUINO #2]</text>

  <!-- D-Pad P2 -->
  <g transform="translate(490, 200)">
    <rect x="-16" y="-55" width="32" height="32" rx="6" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="0" y="-35" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="11">▲</text>
    <rect x="-16" y="23" width="32" height="32" rx="6" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="0" y="43" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="11">▼</text>
    <rect x="-55" y="-16" width="32" height="32" rx="6" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="-39" y="4" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="11">◀</text>
    <rect x="23" y="-16" width="32" height="32" rx="6" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="39" y="4" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="11">▶</text>
    <circle cx="0" cy="0" r="10" fill="#7B2CFF"/>
  </g>

  <!-- Action Buttons P2 -->
  <g transform="translate(650, 200)">
    <circle cx="-35" cy="-25" r="18" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="-35" y="-20" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="9">K</text>
    
    <circle cx="25" cy="-25" r="18" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="25" y="-20" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="9">L</text>
    
    <rect x="-40" y="25" width="80" height="28" rx="8" fill="#FF2DA6" filter="url(#ledGlow)"/>
    <text x="0" y="43" text-anchor="middle" fill="#ffffff" font-family="'Press Start 2P', monospace" font-size="9">SHOOT</text>
  </g>

  <!-- Status Bottom Bar -->
  <rect x="70" y="320" width="660" height="45" rx="6" fill="#09070D" stroke="#7B2CFF" stroke-width="1.5"/>
  <circle cx="100" cy="342" r="5" fill="#20E3FF" filter="url(#ledGlow)"/>
  <text x="115" y="346" fill="#20E3FF" font-family="'Share Tech Mono', monospace" font-size="13">COM3 ACTIVE [P1 9600 BAUD]</text>
  <circle cx="480" cy="342" r="5" fill="#FF2DA6" filter="url(#ledGlow)"/>
  <text x="495" y="346" fill="#FF2DA6" font-family="'Share Tech Mono', monospace" font-size="13">COM4 ACTIVE [P2 9600 BAUD]</text>
</svg>
